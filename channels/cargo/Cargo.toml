[package]
name = "deepbom"
version = "1.96.5"
edition = "2021"
rust-version = "1.85"
description = "Verified native launcher for DEEPBOM deployment-artifact analysis"
license = "Apache-2.0"
repository = "https://github.com/JunHwan-Kwon/deepbom"
homepage = "https://deepbom.org"
readme = "README.md"
keywords = ["onnx", "tflite", "quantization", "ml-bom", "on-device"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
ureq = { version = "=3.1.4", default-features = false, features = ["rustls"] }

[[bin]]
name = "deepbom"
path = "src/main.rs"
