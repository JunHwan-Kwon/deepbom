[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepbom"
version = "1.97.4"
description = "Local deployment-artifact analysis for on-device AI models"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jun-Hwan Kwon" }]
dependencies = []
keywords = ["tflite", "onnx", "gguf", "safetensors", "coreml", "executorch", "tensorrt", "quantization", "on-device", "ml-bom", "cyclonedx", "sarif", "mcp", "model-context-protocol", "chatgpt"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://deepbom.org"
Repository = "https://github.com/JunHwan-Kwon/deepbom"
Issues = "https://github.com/JunHwan-Kwon/deepbom/issues"
DOI = "https://doi.org/10.5281/zenodo.21834508"

[project.scripts]
deepbom = "deepbom.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deepbom = ["SKILL.md", "_engine/*", "_engine/pkg/*"]
