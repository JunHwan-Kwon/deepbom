[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepbom"
version = "2.2.0"
description = "Local deployment-artifact analysis for on-device AI models"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jun-Hwan Kwon" }]
dependencies = []
keywords = ["tflite", "onnx", "gguf", "safetensors", "coreml", "executorch", "tensorrt", "quantization", "on-device", "ml-bom", "cyclonedx", "sarif", "mcp", "model-context-protocol", "chatgpt"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
report = ["reportlab>=4.4,<5", "rfc8785==0.1.4"]
native = ["numpy>=1.26,<3", "rfc8785==0.1.4"]
torch = ["numpy>=1.26,<3", "rfc8785==0.1.4", "torch>=2.8,<2.9"]
tensorflow = ["numpy>=1.26,<3", "rfc8785==0.1.4", "tensorflow>=2.20,<2.21", "keras>=3.11,<3.12"]
tracking = ["numpy>=1.26,<3", "rfc8785==0.1.4", "mlflow-skinny>=3.17,<4", "tensorboard>=2.20,<3", "wandb>=0.30,<0.31"]

[project.urls]
Homepage = "https://deepbom.org"
Repository = "https://github.com/JunHwan-Kwon/deepbom"
Issues = "https://github.com/JunHwan-Kwon/deepbom/issues"
DOI = "https://doi.org/10.5281/zenodo.21834508"

[project.scripts]
deepbom = "deepbom.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deepbom = ["py.typed", "SKILL.md", "_engine/*", "_engine/pkg/*", "training/board.js", "optimization/report-diff.js", "optimization/report-diff.css"]
