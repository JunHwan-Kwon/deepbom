name: Release DEEPBOM Installation Channels

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Exact release/version.json base version
        required: true
        type: string
      publish:
        description: Publish verified artifacts to GitHub Releases, npm, PyPI, and crates.io
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  DEEPBOM_RELEASE_VERSION: ${{ inputs.expected_version }}

concurrency:
  group: deepbom-installation-channels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-wheel:
    name: Wheel ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            os: windows-2025
            wheel_tag: ""
          - id: windows-arm64
            os: windows-11-arm
            wheel_tag: ""
          - id: linux-x64
            os: ubuntu-24.04
            wheel_tag: manylinux_2_28_x86_64
          - id: linux-arm64
            os: ubuntu-24.04-arm
            wheel_tag: manylinux_2_28_aarch64
          - id: macos-x64
            os: macos-15-intel
            wheel_tag: macosx_14_0_x86_64
          - id: macos-arm64
            os: macos-15
            wheel_tag: macosx_14_0_arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          cache: npm
          package-manager-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: channels/python/requirements-build.txt
      - name: Verify release identity
        shell: bash
        run: |
          node scripts/sync-version.mjs --validate-release "${{ inputs.expected_version }}"
          node scripts/sync-version.mjs --release "${{ inputs.expected_version }}"
          actual="$(node -p "require('./package.json').version")"
          test "$actual" = "${{ inputs.expected_version }}"
          if [[ "${{ inputs.publish }}" == "true" ]]; then
            test "${GITHUB_REF}" = "refs/tags/channels-v${actual}"
          fi
      - name: Install pinned build dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check -r channels/python/requirements-build.txt
      - name: Build installation channels
        env:
          DEEPBOM_WHEEL_PLATFORM_TAG: ${{ matrix.wheel_tag }}
        run: npm run build:channels
      - name: Verify public package boundary
        run: npm run check:public-package-boundary
      - name: Verify platform engine and wheel smoke
        if: matrix.id != 'linux-x64'
        run: npm run check:channels -- --no-build --platform-smoke
      - name: Verify full installed channel equivalence
        if: matrix.id == 'linux-x64'
        run: npm run check:channels -- --no-build --release-contract
      - name: Verify current wheel
        shell: bash
        run: |
          identity="${{ matrix.id }}"
          identity="${identity/windows/win32}"
          identity="${identity/macos/darwin}"
          python scripts/verify-python-wheel-matrix.py .local-validation/channel-release/python-dist --expected "$identity" ${{ inputs.publish && '--require-clean' || '' }}
      - name: Verify Linux glibc ceiling
        if: runner.os == 'Linux'
        shell: bash
        run: |
          engine=".local-validation/channel-release/engine/${{ matrix.id }}/deepbom-core"
          highest="$(readelf --version-info "$engine" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -1)"
          test -n "$highest"
          first="$(printf '%s\n%s\n' "$highest" 'GLIBC_2.28' | sort -V | head -1)"
          test "$first" = "$highest"
      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: deepbom-wheel-${{ matrix.id }}
          path: .local-validation/channel-release/python-dist/*.whl
          if-no-files-found: error
          retention-days: 7
      - name: Upload npm tarball
        if: matrix.id == 'linux-x64'
        uses: actions/upload-artifact@v6
        with:
          name: deepbom-npm
          path: .local-validation/channel-release/npm/deepbom-*.tgz
          if-no-files-found: error
          retention-days: 7
      - name: Upload standalone engine
        uses: actions/upload-artifact@v6
        with:
          name: deepbom-engine-${{ matrix.id }}
          path: .local-validation/channel-release/engine/
          if-no-files-found: error
          retention-days: 7

  verify-matrix:
    name: Verify complete wheel matrix
    needs: build-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Materialize release metadata
        run: node scripts/sync-version.mjs --release "${{ inputs.expected_version }}"
      - uses: actions/download-artifact@v6
        with:
          pattern: deepbom-wheel-*
          path: dist
          merge-multiple: true
      - name: Verify wheel matrix and RECORD integrity
        run: python scripts/verify-python-wheel-matrix.py dist ${{ inputs.publish && '--require-clean' || '' }}
      - uses: actions/upload-artifact@v6
        with:
          name: deepbom-python-release
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  verify-engine-release:
    name: Verify immutable engine release
    needs: build-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Materialize release metadata
        run: node scripts/sync-version.mjs --release "${{ inputs.expected_version }}"
      - uses: actions/download-artifact@v6
        with:
          pattern: deepbom-engine-*
          path: engines
          merge-multiple: true
      - name: Build the six-target release matrix
        run: node scripts/build-cargo-engine-release.mjs --input engines --output release --version "${{ inputs.expected_version }}"
      - name: Verify release checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Install declared Cargo MSRV
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update
      - name: Test and package the Cargo launcher
        run: |
          cargo +1.85.0 test --locked --manifest-path channels/cargo/Cargo.toml
          cargo +1.85.0 package --locked --manifest-path channels/cargo/Cargo.toml
      - uses: actions/upload-artifact@v6
        with:
          name: deepbom-engine-release
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish-github-release:
    name: Publish immutable engine assets
    if: inputs.publish
    needs: [verify-matrix, verify-engine-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: deepbom-engine-release
          path: release
      - name: Create draft, attach all assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: channels-v${{ inputs.expected_version }}
        run: |
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "DEEPBOM ${{ inputs.expected_version }}" --notes "Verified DEEPBOM installation-channel engines for Windows, Linux, and macOS on x86-64 and ARM64. Asset identities are recorded in engine-matrix.v1.json and SHA256SUMS."
          gh release upload "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  smoke-cargo-release:
    name: Smoke-test Cargo against published engines
    if: inputs.publish
    needs: publish-github-release
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Materialize release metadata
        run: node scripts/sync-version.mjs --release "${{ inputs.expected_version }}"
      - name: Install declared Cargo MSRV
        shell: pwsh
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update
      - name: Download, verify, and execute the immutable release engine
        shell: pwsh
        env:
          DEEPBOM_HOME: ${{ runner.temp }}\deepbom-cargo-smoke
        run: |
          $version = cargo +1.85.0 run --quiet --locked --manifest-path channels/cargo/Cargo.toml -- --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "deepbom ${{ inputs.expected_version }}") {
            throw "Cargo launcher version contract failed: $version"
          }
          cargo +1.85.0 run --quiet --locked --manifest-path channels/cargo/Cargo.toml -- engine verify
          if ($LASTEXITCODE -ne 0) { throw "Remote engine verification failed." }
          $tfliteOutput = cargo +1.85.0 run --quiet --locked --manifest-path channels/cargo/Cargo.toml -- audit web/samples/mobilenet_v2_1.0_224_quant.tflite --target android_mid_a55 --compact
          if ($LASTEXITCODE -ne 0) { throw "Remote engine TFLite/WASM execution failed." }
          $tflite = ($tfliteOutput -join "`n") | ConvertFrom-Json
          if ($tflite.format -ne "tflite" -or $tflite.operator_count -ne 65 -or $tflite.tensor_count -ne 173 -or $tflite.total_macs -ne 300775552) {
            throw "Remote engine TFLite evidence contract diverged."
          }
          $onnxOutput = cargo +1.85.0 run --quiet --locked --manifest-path channels/cargo/Cargo.toml -- audit corpus/onnx-extension-contract-corpus/deepbom-static-per-axis-qdq.onnx --compact
          if ($LASTEXITCODE -ne 0) { throw "Remote engine ONNX execution failed." }
          ($onnxOutput -join "`n") | ConvertFrom-Json | Out-Null

  publish-cargo:
    name: Publish Cargo bootstrap release
    if: inputs.publish
    needs: smoke-cargo-release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: crates-io
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Materialize release metadata
        run: node scripts/sync-version.mjs --release "${{ inputs.expected_version }}"
      - name: Publish verified launcher
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --manifest-path channels/cargo/Cargo.toml

  publish-pypi:
    name: Publish PyPI with Trusted Publishing
    if: inputs.publish
    needs: smoke-cargo-release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: deepbom-python-release
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  publish-npm:
    name: Publish npm with Trusted Publishing
    if: inputs.publish
    needs: smoke-cargo-release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: deepbom-npm
          path: dist
      - uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify npm Trusted Publishing support
        shell: bash
        run: |
          npm_version="$(npm --version)"
          node -e '
            const [major, minor] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 5)) {
              throw new Error(`npm >= 11.5.1 is required for Trusted Publishing; observed ${process.argv[1]}`);
            }
          ' "$npm_version"
      - name: Publish verified package
        run: npm publish ./dist/deepbom-${{ inputs.expected_version }}.tgz --access public
