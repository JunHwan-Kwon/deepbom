name: DeepBOM Public Core Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepbom-public-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-core:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          cache: npm
          package-manager-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: channels/python/requirements-build.txt
      - name: Install pinned dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check -r channels/python/requirements-build.txt
      - name: Install pinned browser runtime
        run: npx playwright install --with-deps chromium
      - name: Audit public dependency graph
        run: npm audit --audit-level=high
      - name: Verify clean public source boundary
        run: |
          npm run check:public-source
          node scripts/verify-public-source-export.mjs .
          node scripts/check-git-privacy.mjs
          node scripts/check-ci-deploy-contract.mjs
      - name: Verify CLI and format analyzers
        run: |
          npm run check:cli
          npm run check:formats
      - name: Build public installation channels
        run: npm run build:channels
      - name: Verify package disclosure boundary
        run: npm run check:public-package-boundary
      - name: Verify installed channel equivalence
        run: npm run check:channels -- --no-build
      - name: Verify public Rust analyzer
        run: npm run check:rust
