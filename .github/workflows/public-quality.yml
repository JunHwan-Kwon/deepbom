name: DeepBOM Public Core Quality

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "bin/**"
      - "channels/**"
      - "config/**"
      - "corpus/**"
      - "pkg/**"
      - "scripts/**"
      - "src/**"
      - "web/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "package-lock.json"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepbom-public-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-core:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DEEPBOM_CHECK_TIMEOUT_MS: 120000
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          cache: npm
          package-manager-cache: true
      - name: Verify immutable public source boundary
        run: |
          npm run check:public-source
          node scripts/verify-public-source-export.mjs .
          node scripts/check-git-privacy.mjs
          node scripts/check-ci-deploy-contract.mjs
      - name: Install pinned dependencies
        run: npm ci
      - name: Audit public dependency graph
        run: npm audit --audit-level=high
      - name: Verify CLI and browser-independent format analyzers
        run: |
          npm run check:cli-docs
          npm run check:cli
          npm run check:formats:core
