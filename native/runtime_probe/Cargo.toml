[package]
name = "deepbom-runtime-contract-probe"
version = "0.1.0"
edition = "2021"
description = "Deterministic synthetic producer for validating the DeepBOM native capture contract."
license = "ISC"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
